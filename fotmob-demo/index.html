<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0a0c0e;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}button{font:inherit;color:inherit;border:0;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--orange);outline-offset:2px}.app{position:relative;margin:0 auto;width:min(100%,480px);height:100dvh;min-height:620px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 50px #0008}.statusbar{height:26px;flex:0 0 26px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:#dce0e3;font-size:11px;font-weight:650;letter-spacing:.2px}.status-icons{display:flex;gap:7px;align-items:center;color:#cdd2d5}.signal{display:inline-flex;gap:2px;align-items:flex-end;height:10px}.signal i{display:block;width:2px;border-radius:2px;background:#dce0e3}.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:6px}.signal i:nth-child(3){height:8px}.signal i:nth-child(4){height:10px}.battery{width:16px;height:8px;border:1px solid #dce0e3;border-radius:2px;position:relative}.battery:before{content:"";position:absolute;inset:1.5px 3px 1.5px 1.5px;background:#dce0e3;border-radius:1px}.battery:after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:3px;background:#dce0e3;border-radius:0 2px 2px 0}
.appbar{height:60px;flex:0 0 60px;padding:0 17px;display:flex;align-items:center;gap:11px;border-bottom:1px solid #252a2e}.brandmark{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,#ff8a49,#ed4e37);box-shadow:0 4px 15px #f35a3538}.brandmark svg{width:22px;height:22px}.brand{font-weight:780;font-size:20px;letter-spacing:-.65px;flex:1}.live-chip{font-size:9px;font-weight:800;letter-spacing:.65px;color:#ffb49a;border:1px solid #68402f;background:#291b17;border-radius:7px;padding:5px 7px;display:inline-flex;align-items:center;gap:5px}.live-dot{width:6px;height:6px;border-radius:50%;background:#ff6f62;box-shadow:0 0 0 3px #f06e6e18}.icon-btn{width:37px;height:37px;display:grid;place-items:center;border-radius:50%;background:transparent;color:#b2bbc1}.icon-btn:hover{background:var(--surface2);color:#fff}.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;overflow:auto;scrollbar-width:none;padding-bottom:14px}main::-webkit-scrollbar{display:none}.datebar{height:70px;display:flex;align-items:center;gap:6px;padding:8px 13px 10px;border-bottom:1px solid #252a2e}.daynav{width:27px;height:40px;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:9px;flex:0 0 27px}.daynav:hover{background:var(--surface2);color:#fff}.daynav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}.daystrip{display:flex;gap:4px;align-items:stretch;flex:1;justify-content:space-between;min-width:0}.day{width:39px;min-width:0;background:transparent;color:var(--muted);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.day .dow{font-size:9px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}.day .num{font-size:13px;font-weight:700}.day.selected{background:#f2f4f4;color:#171a1c}.day.today:not(.selected) .num{color:var(--orange)}.day:hover:not(.selected){background:var(--surface2)}
.date-heading{padding:17px 16px 11px;display:flex;align-items:center;justify-content:space-between;gap:10px}.date-title{font-size:17px;font-weight:750;letter-spacing:-.25px}.date-subtitle{margin-top:4px;color:var(--muted);font-size:10px;line-height:1.4}.section-actions{display:flex;align-items:center;gap:6px}.tiny-action{height:32px;padding:0 9px;background:var(--surface2);border:1px solid #30363b;border-radius:9px;color:#bac2c8;font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.tiny-action svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}.tiny-action:disabled{opacity:.6;cursor:wait}.feed-notice{margin:0 14px 11px;padding:9px 10px;border:1px solid #49402e;background:#211f19;border-radius:10px;display:flex;gap:8px;align-items:flex-start;color:#d7cba8;font-size:10px;line-height:1.4}.notice-dot{width:7px;height:7px;flex:0 0 7px;border-radius:50%;margin-top:3px;background:var(--yellow);box-shadow:0 0 0 3px #f2c75c18}.feed-notice.error{border-color:#633638;background:#26191b;color:#e9b4b4}.feed-notice.error .notice-dot{background:var(--red)}
.filters{padding:0 14px 11px;display:flex;gap:7px;overflow:auto;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;padding:7px 12px;border-radius:20px;background:#1b1f22;color:#a9b1b7;font-size:11px;font-weight:700;border:1px solid #2d3338}.filter.active{background:#efeef0;color:#131517;border-color:#efeef0}.filter.live.active{background:#f06e6e;color:#fff;border-color:#f06e6e}.league{margin:0 12px 11px;background:var(--surface);border:1px solid #292f33;border-radius:var(--radius);overflow:hidden}.league-head{min-height:48px;padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #292f33}.competition-mark{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;background:#272c30;color:#ffb18e;font-size:13px;font-weight:800}.league-name{font-size:12px;font-weight:750;flex:1}.league-meta{font-size:9px;color:var(--muted);margin-top:3px}.league-right{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:9px}
.match-row{position:relative;min-height:75px;display:grid;grid-template-columns:49px 1fr 42px 29px;align-items:center;gap:7px;padding:9px 9px 9px 7px;border-bottom:1px solid #252a2e}.match-row:last-child{border-bottom:0}.match-time{font-size:9px;color:var(--muted);text-align:center;line-height:1.4}.match-time.live{color:#ff8585;font-weight:800}.match-time .state-label{display:block;font-size:7px;letter-spacing:.2px;font-weight:800;line-height:1.2;margin-top:3px}.teams{display:flex;flex-direction:column;gap:7px;min-width:0}.team{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px;font-weight:590}.team-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crest{width:19px;height:19px;border-radius:50%;flex:0 0 19px;display:grid;place-items:center;font-size:7px;font-weight:850;color:white;border:1px solid #ffffff24;background:linear-gradient(140deg,#47565b,#252c31)}.scorecol{display:flex;flex-direction:column;gap:7px;align-items:center;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}.scorecol .dimscore{color:#9ca5ab}.star-btn{width:28px;height:30px;display:grid;place-items:center;background:transparent;color:#707a81;border-radius:50%}.star-btn:hover{color:#f4c45a;background:#292d2f}.star-btn.selected{color:#f4c45a}.star-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}.star-btn.selected svg{fill:#f4c45a}.match-badge{position:absolute;left:65px;bottom:3px;font-size:8px;font-weight:750;color:#849098;letter-spacing:.15px}.empty{margin:20px 14px;padding:26px 18px;text-align:center;border:1px dashed #353c41;border-radius:14px;color:var(--muted);font-size:12px;line-height:1.5}.empty strong{display:block;color:#dfe3e5;font-size:14px;margin-bottom:5px}.screen-footnote{padding:9px 17px 5px;color:#737d84;font-size:9px;line-height:1.5;text-align:center}.screen-footnote a,.source-link{color:#ffb08e;text-decoration:underline;text-underline-offset:2px}
.bottomnav{height:67px;flex:0 0 calc(67px + var(--safe-bottom));padding:5px 8px calc(5px + var(--safe-bottom));display:flex;justify-content:space-around;align-items:center;background:#15181a;border-top:1px solid #2c3236}.navitem{position:relative;min-width:65px;height:53px;padding:4px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#7f8990;background:transparent;border-radius:12px}.navitem svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.navitem span{font-size:9px;font-weight:650;letter-spacing:.1px}.navitem.active{color:#f4f5f6}.navitem.active:before{content:"";position:absolute;top:0;width:21px;height:2px;border-radius:3px;background:var(--orange)}.navitem.active svg{color:var(--orange)}
.page-heading{padding:18px 16px 12px;display:flex;align-items:center;justify-content:space-between}.page-heading h1{font-size:23px;letter-spacing:-.6px;margin:0;font-weight:780}.page-heading p{font-size:11px;color:var(--muted);margin:4px 0 0}.content-card{margin:0 12px 12px;padding:14px;background:var(--surface);border:1px solid #292f33;border-radius:var(--radius)}.content-card h2{font-size:14px;margin:0 0 8px}.content-card p{font-size:11px;line-height:1.55;color:#b6bec3;margin:6px 0}.source-card{display:flex;align-items:flex-start;gap:11px}.source-card .competition-mark{width:38px;height:38px;flex:0 0 38px}.source-card strong{font-size:12px}.source-card small{display:block;color:var(--muted);font-size:10px;line-height:1.45;margin-top:4px}.league-list{margin:0 12px 11px;background:var(--surface);border:1px solid #292f33;border-radius:var(--radius);overflow:hidden}.league-list-row{display:flex;align-items:center;gap:11px;padding:12px;border-bottom:1px solid #292f33}.league-list-row:last-child{border:0}.league-info{flex:1}.league-info strong{display:block;font-size:12px}.league-info small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.follow{background:#252a2e;color:#c2c9ce;border:1px solid #343a3f;border-radius:18px;font-size:10px;font-weight:750;padding:7px 11px}.follow.following{color:#ffb299;border-color:#714531;background:#2e211a}.more-arrow{color:#778188;font-size:18px}.toast{position:absolute;left:50%;bottom:78px;z-index:40;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#30363a;color:#f5f5f6;border:1px solid #454c50;box-shadow:0 10px 25px #0008;border-radius:11px;padding:10px 14px;font-size:11px;max-width:90%;text-align:center;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.loading{margin:20px 14px;padding:24px;text-align:center;color:var(--muted);font-size:12px;border:1px solid var(--line);border-radius:14px}.pill{display:inline-block;padding:3px 6px;border-radius:7px;background:#282d30;color:#b7c0c5;font-size:9px;font-weight:700}
@media(min-width:700px){body{display:grid;place-items:center;background:radial-gradient(ellipse at center,#1c2227,#0a0c0e 70%)}.app{height:min(920px,96dvh);min-height:680px;border:1px solid #31373c;border-radius:25px}.statusbar{border-radius:25px 25px 0 0}.bottomnav{border-radius:0 0 25px 25px}}
</style>

<body>
<div class="app" id="app">
  <div class="statusbar"><span id="clock">--:--</span><div class="status-icons"><span class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i></span><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9a14 14 0 0 1 18 0M6 12a9 9 0 0 1 12 0m-9 3a4 4 0 0 1 6 0" fill="none" stroke="#dce0e3" stroke-width="2" stroke-linecap="round"/></svg><span class="battery" aria-hidden="true"></span></div></div>
  <header class="appbar">
    <div class="brandmark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="white" stroke-width="1.4"/><path d="m12 7 3 2.2-1.1 3.5h-3.8L9 9.2 12 7Zm0 0V3m3 6.2 4.1-1.3m-5.2 4.8 2.1 4m-5.1-4-2.1 4M9 9.2 5 7.9" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="brand">Matchday</div><span class="live-chip"><span class="live-dot"></span>FOOTBALL</span>
    <button class="icon-btn" aria-label="Reload the published score snapshot" data-action="refresh"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 9A7 7 0 0 1 18 6.4L20 12M4 12l2 5.6A7 7 0 0 0 17.9 15"/></svg></button>
  </header>
  <main id="content" aria-live="polite"></main>
  <nav class="bottomnav" aria-label="Main navigation" id="bottomnav"></nav>
  <div class="toast" id="toast" role="status"></div>
</div>
<script>
'use strict';
const DATA_URL='./data/matches.json';
const SNAPSHOT_CACHE_KEY='matchday_openligadb_snapshot_v1';
const FAVORITES_KEY='matchday_favorites_v1';
const REFRESH_MS=60_000;
const state={page:'Matches',filter:'All',dateOffset:0,favorites:new Set(readFavorites()),snapshot:null,feedError:false,refreshing:false,leagueFilter:null};
const navItems=[['Matches','<path d="M4 5.5h16M4 12h16M4 18.5h16"/><circle cx="7" cy="5.5" r="1" fill="currentColor"/><circle cx="7" cy="12" r="1" fill="currentColor"/><circle cx="7" cy="18.5" r="1" fill="currentColor"/>'],['Leagues','<circle cx="12" cy="12" r="9"/><path d="M3.5 9h17M5 16h14M12 3c2.3 2.5 3.3 5.5 3.3 9S14.3 18.5 12 21M12 3C9.7 5.5 8.7 8.5 8.7 12s1 6.5 3.3 9"/>'],['About','<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>']];
function readFavorites(){try{return JSON.parse(localStorage.getItem(FAVORITES_KEY)||'[]')}catch{return []}}
function saveFavorites(){try{localStorage.setItem(FAVORITES_KEY,JSON.stringify([...state.favorites]))}catch{}}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localDateKey(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
function selectedDate(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+state.dateOffset);return d}
function formatDate(date,options){return new Intl.DateTimeFormat(undefined,options).format(date)}
function todayLabel(){if(state.dateOffset===0)return 'Today';if(state.dateOffset===-1)return 'Yesterday';if(state.dateOffset===1)return 'Tomorrow';return formatDate(selectedDate(),{weekday:'long',month:'short',day:'numeric'})}
function dateStrip(){const base=new Date();base.setHours(12,0,0,0);const days=[];for(let n=-3;n<=3;n++){const d=new Date(base);d.setDate(base.getDate()+state.dateOffset+n);const off=state.dateOffset+n;days.push(`<button class="day ${off===state.dateOffset?'selected':''} ${off===0?'today':''}" data-action="setdate" data-offset="${off}" aria-label="${esc(formatDate(d,{weekday:'long',month:'long',day:'numeric'}))}"><span class="dow">${esc(formatDate(d,{weekday:'short'}))}</span><span class="num">${d.getDate()}</span></button>`)}return `<div class="datebar"><button class="daynav" aria-label="Previous day" data-action="dateprev"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div class="daystrip">${days.join('')}</div><button class="daynav" aria-label="Next day" data-action="datenext"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div>`}
function allMatches(){return (state.snapshot?.competitions||[]).flatMap(comp=>(comp.matches||[]).map(m=>({...m,competition:comp.name,competitionId:comp.id,shortcut:comp.shortcut,season:comp.season}))).filter(m=>Number.isFinite(new Date(m.kickoffUtc).getTime()))}
function statusOf(match,now=new Date()){
 const kickoff=new Date(match.kickoffUtc),elapsed=(now-kickoff)/60000,hasScore=!!match.score&&Number.isFinite(Number(match.score.home))&&Number.isFinite(Number(match.score.away));
 if(match.finished)return 'finished';
 if(kickoff>now)return 'upcoming';
 if(elapsed<=180)return hasScore?'live':'no-score';
 return hasScore?'unconfirmed':'unreported';
}
function statusText(kind){return ({live:'LIVE',finished:'FT',upcoming:'SCHEDULED','no-score':'NO SCORE POSTED',unconfirmed:'STATUS UNCONFIRMED',unreported:'RESULT NOT REPORTED'})[kind]||'STATUS UNKNOWN'}
function timeText(match,kind){const d=new Date(match.kickoffUtc);if(kind==='live')return '●';if(kind==='finished')return 'FT';if(kind==='no-score')return formatDate(d,{hour:'2-digit',minute:'2-digit',hourCycle:'h23'});return formatDate(d,{hour:'2-digit',minute:'2-digit',hourCycle:'h23'})}
function initials(name){return String(name||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'?'}
function dateSubtitle(matches){const stamp=state.snapshot?.snapshotUpdatedAt;const when=stamp?formatDate(new Date(stamp),{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'unknown';return `${matches.length} source-listed match${matches.length===1?'':'es'} · Snapshot published ${esc(when)} · automatic checks target ~5 min`}
function notice(){if(state.feedError)return `<div class="feed-notice error"><span class="notice-dot"></span><span>Could not reload the published feed. Showing the last available snapshot; it may be out of date.</span></div>`;if(!state.snapshot)return `<div class="loading">Loading real fixture and result data…</div>`;return `<div class="feed-notice"><span class="notice-dot"></span><span>Scores from <a class="source-link" href="https://www.openligadb.de/lizenz" target="_blank" rel="noopener noreferrer">OpenLigaDB · ODbL 1.0</a>. Community updates may be delayed or incomplete. Missing scores stay blank.</span></div>`}
function matchRow(m){const kind=statusOf(m),score=m.score,scoreAvailable=score&&Number.isFinite(Number(score.home))&&Number.isFinite(Number(score.away));const timeClass=kind==='live'?'match-time live':'match-time';const scoreHtml=scoreAvailable?`<span>${esc(score.home)}</span><span>${esc(score.away)}</span>`:`<span class="dimscore">–</span><span class="dimscore">–</span>`;const badge=m.round?`<span class="match-badge">${esc(m.round)}</span>`:'';return `<div class="match-row"><div class="${timeClass}">${esc(timeText(m,kind))}<span class="state-label">${esc(statusText(kind))}</span></div><div class="teams"><div class="team"><span class="crest" aria-hidden="true">${esc(initials(m.home))}</span><span class="team-name">${esc(m.home)}</span></div><div class="team"><span class="crest" aria-hidden="true">${esc(initials(m.away))}</span><span class="team-name">${esc(m.away)}</span></div></div><div class="scorecol">${scoreHtml}</div><button class="star-btn ${state.favorites.has(String(m.id))?'selected':''}" aria-label="${state.favorites.has(String(m.id))?'Remove':'Add'} ${esc(m.home)} vs ${esc(m.away)} ${state.favorites.has(String(m.id))?'from':'to'} favorites" data-action="favorite" data-id="${esc(m.id)}"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></svg></button>${badge}</div>`}
function filteredMatches(){const dateKey=localDateKey(selectedDate()),all=allMatches().filter(m=>localDateKey(new Date(m.kickoffUtc))===dateKey);let result=all;if(state.leagueFilter)result=result.filter(m=>m.competitionId===state.leagueFilter);if(state.filter==='Favorites')result=result.filter(m=>state.favorites.has(String(m.id)));if(state.filter==='Live')result=result.filter(m=>statusOf(m)==='live');if(state.filter==='Finished')result=result.filter(m=>statusOf(m)==='finished');if(state.filter==='Upcoming')result=result.filter(m=>statusOf(m)==='upcoming');const order={live:0,'no-score':1,upcoming:2,unconfirmed:3,unreported:4,finished:5};return result.sort((a,b)=>(order[statusOf(a)]-order[statusOf(b)])||(new Date(a.kickoffUtc)-new Date(b.kickoffUtc)))}
function matchesPage(){const matches=filteredMatches();const groups=[...new Set(matches.map(m=>m.competition))];const comps=state.snapshot?.competitions||[];const visibleMatches=allMatches().filter(m=>localDateKey(new Date(m.kickoffUtc))===localDateKey(selectedDate()));return `${dateStrip()}<div class="date-heading"><div><div class="date-title">${esc(todayLabel())}</div><div class="date-subtitle">${dateSubtitle(visibleMatches)}</div></div><div class="section-actions"><button class="tiny-action" data-action="refresh" ${state.refreshing?'disabled':''}><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 9A7 7 0 0 1 18 6.4L20 12M4 12l2 5.6A7 7 0 0 0 17.9 15"/></svg>${state.refreshing?'Checking':'Reload'}</button></div></div>${notice()}<div class="filters">${['All','Favorites','Live','Finished','Upcoming'].map(x=>`<button class="filter ${state.filter===x?'active':''} ${x==='Live'?'live':''}" data-action="filter" data-filter="${x}">${x==='Live'?'● ':''}${x}</button>`).join('')}</div>${!state.snapshot?`<div class="empty"><strong>Waiting for the real-data feed</strong>Try again in a moment.</div>`:groups.length?groups.map(g=>{const ms=matches.filter(m=>m.competition===g);const comp=comps.find(c=>c.id===ms[0].competitionId);return `<section class="league"><div class="league-head"><span class="competition-mark" aria-hidden="true">${esc(g==='Bundesliga'?'B':g==='Premier League'?'P':g==='LaLiga'?'L':'★')}</span><div style="flex:1"><div class="league-name">${esc(g)}</div><div class="league-meta">${esc(comp?.sourceName||g)} · ${ms.length} match${ms.length===1?'':'es'}</div></div><div class="league-right"><span>${esc(comp?.season??'')}</span></div></div>${ms.map(matchRow).join('')}</section>`}).join(''):`<div class="empty"><strong>${visibleMatches.length?'No matches match this filter':'No source-listed matches for this date'}</strong>${visibleMatches.length?'Try another status filter or competition.':'OpenLigaDB may not cover every competition or may not yet have a fixture entered for this day. Nothing has been estimated or filled with made-up results.'}</div>`}<div class="screen-footnote">${esc(state.snapshot?.attribution||'Football data from OpenLigaDB (www.openligadb.de), licensed under ODbL 1.0.')}<br><a href="https://www.openligadb.de/lizenz" target="_blank" rel="noopener noreferrer">Data license: ODbL 1.0</a> · Community coverage and score updates are not guaranteed.</div>`}
function leaguesPage(){const comps=state.snapshot?.competitions||[];if(!state.snapshot)return `<div class="page-heading"><div><h1>Competitions</h1><p>Loading provider-listed competitions</p></div></div>${notice()}`;return `<div class="page-heading"><div><h1>Competitions</h1><p>Only competitions found in the current source feed</p></div></div><div class="league-list">${comps.map(c=>{const count=(c.matches||[]).filter(m=>localDateKey(new Date(m.kickoffUtc))===localDateKey(selectedDate())).length;return `<div class="league-list-row"><div class="competition-mark" aria-hidden="true">${esc(c.name==='Bundesliga'?'B':c.name==='Premier League'?'P':c.name==='LaLiga'?'L':'★')}</div><div class="league-info"><strong>${esc(c.name)}</strong><small>${esc(c.sourceName)} · ${count} match${count===1?'':'es'} on ${esc(todayLabel().toLowerCase())}</small></div><button class="follow ${state.leagueFilter===c.id?'following':''}" data-action="leaguefilter" data-id="${esc(c.id)}">${state.leagueFilter===c.id?'Selected':'View'}</button></div>`}).join('')}</div>${state.leagueFilter?`<div class="content-card"><button class="tiny-action" data-action="clearleague">Show all competitions</button></div>`:''}<div class="screen-footnote">This list follows the provider's available current-season feed; it is not a complete list of world football leagues.</div>`}
function aboutPage(){const snap=state.snapshot;const published=snap?.snapshotUpdatedAt?formatDate(new Date(snap.snapshotUpdatedAt),{dateStyle:'medium',timeStyle:'short'}):'not available';return `<div class="page-heading"><div><h1>About this feed</h1><p>Real match records, with their limits made visible</p></div></div><div class="content-card source-card"><div class="competition-mark" aria-hidden="true">i</div><div><strong>Source: OpenLigaDB</strong><small>Community-entered football data, available without an API key. It is not editorially verified, so coverage, score accuracy, and freshness can vary.</small></div></div><div class="content-card"><h2>What the labels mean</h2><p><span class="pill">LIVE</span> A non-final match with a score reported by the source. Match minutes and event commentary are not provided here.</p><p><span class="pill">NO SCORE POSTED</span> Kickoff time has passed, but no score was supplied. The site does not assume a 0–0 score.</p><p><span class="pill">STATUS UNCONFIRMED</span> A score exists but the source has not marked the match finished after the normal live window.</p><p><span class="pill">FT</span> The source marks the match finished. If there is no score, no score is displayed.</p></div><div class="content-card"><h2>Refresh and coverage</h2><p>The server checks the provider about every five minutes when scheduled jobs run; timing can be delayed and the provider may itself lag. “Snapshot published” is the last time this site's public data file changed, not a promise that every score was just checked.</p><p>Only current-season competitions available in OpenLigaDB are included. Missing competitions, matches, or results stay missing rather than being estimated or filled with made-up results.</p><p><a class="source-link" href="https://api.openligadb.de/" target="_blank" rel="noopener noreferrer">OpenLigaDB API</a> · <a class="source-link" href="https://www.openligadb.de/nutzungsbedingungen" target="_blank" rel="noopener noreferrer">API usage terms</a></p></div><div class="content-card"><h2>Required attribution</h2><p>Football data from OpenLigaDB (www.openligadb.de), licensed under ODbL 1.0.</p><p><a class="source-link" href="https://www.openligadb.de/lizenz" target="_blank" rel="noopener noreferrer">Read the OpenLigaDB data license</a></p><p>Published data snapshot: ${esc(published)} · ODbL 1.0. The interface is separate from the licensed data.</p></div><div class="screen-footnote">No third-party team badges are loaded. Team names and scores are shown as supplied by the data source.</div>`}
function render(){document.getElementById('bottomnav').innerHTML=navItems.map(([name,path])=>`<button class="navitem ${state.page===name?'active':''}" data-action="nav" data-page="${name}"><svg viewBox="0 0 24 24">${path}</svg><span>${name}</span></button>`).join('');const content=document.getElementById('content');content.innerHTML=state.page==='Matches'?matchesPage():state.page==='Leagues'?leaguesPage():aboutPage();}
let toastTimer;function toast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
async function pollSnapshot(manual=false){if(state.refreshing)return;state.refreshing=true;if(manual)render();let shouldRender=manual;try{const response=await fetch(`${DATA_URL}?v=${Math.floor(Date.now()/60_000)}`,{cache:'no-store',headers:{'Accept':'application/json'}});if(!response.ok)throw new Error(`Feed HTTP ${response.status}`);const next=await response.json();if(!Array.isArray(next.competitions))throw new Error('Invalid feed format');const prior=state.snapshot?.snapshotUpdatedAt;const wasError=state.feedError;state.snapshot=next;state.feedError=false;shouldRender=shouldRender||!prior||prior!==next.snapshotUpdatedAt||wasError;try{localStorage.setItem(SNAPSHOT_CACHE_KEY,JSON.stringify(next))}catch{}if(manual)toast(prior===next.snapshotUpdatedAt?'No new published data yet':'Published data refreshed');}catch(error){const wasError=state.feedError;state.feedError=true;if(!state.snapshot){try{const saved=JSON.parse(localStorage.getItem(SNAPSHOT_CACHE_KEY)||'null');if(saved?.competitions)state.snapshot=saved}catch{}}shouldRender=shouldRender||!wasError;if(manual)toast('Could not reload the published feed');console.warn('Score snapshot unavailable:',error)}finally{state.refreshing=false;if(shouldRender)render()}}
function updateClock(){document.getElementById('clock').textContent=formatDate(new Date(),{hour:'2-digit',minute:'2-digit'})}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;if(action==='nav'){state.page=button.dataset.page;render()}else if(action==='setdate'){state.dateOffset=Number(button.dataset.offset);render()}else if(action==='dateprev'){state.dateOffset--;render()}else if(action==='datenext'){state.dateOffset++;render()}else if(action==='filter'){state.filter=button.dataset.filter;render()}else if(action==='refresh'){pollSnapshot(true)}else if(action==='favorite'){event.stopPropagation();const id=String(button.dataset.id);state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);saveFavorites();render();toast(state.favorites.has(id)?'Match added to favorites':'Match removed from favorites')}else if(action==='leaguefilter'){state.leagueFilter=Number(button.dataset.id);state.page='Matches';state.filter='All';render()}else if(action==='clearleague'){state.leagueFilter=null;render()}});
updateClock();setInterval(updateClock,15_000);render();pollSnapshot(false);setInterval(()=>pollSnapshot(false),REFRESH_MS);
</script>
