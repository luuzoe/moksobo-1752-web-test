function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getDate(){const d=new Date(Date.UTC(2026,10,1+state.dateOffset));return d}
function dateStrip(){let d=getDate();const strip=[];for(let n=-3;n<=3;n++){let x=new Date(d);x.setUTCDate(d.getUTCDate()+n);strip.push(`<button class="day ${n===0?'selected':''} ${state.dateOffset+n===0?'today':''}" data-action="setdate" data-offset="${state.dateOffset+n}"><span class="dow">${x.toLocaleDateString('en-US',{weekday:'short',timeZone:'UTC'})}</span><span class="num">${x.getUTCDate()}</span></button>`)}return `<div class="datebar"><button class="daynav" aria-label="Previous day" data-action="dateprev"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div class="daystrip">${strip.join('')}</div><button class="daynav" aria-label="Next day" data-action="datenext"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div>`}
function dateLabel(){const d=getDate();return state.dateOffset===0?'Today':d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',timeZone:'UTC'})}
function crest(initials,color){return `<span class="crest" style="background:${color}">${esc(initials)}</span>`}
function matchRow(m){const isLive=m.status==='live',score=m.status!=='upcoming';return `<div class="match-row" role="button" tabindex="0" data-action="openmatch" data-id="${m.id}"><div class="match-time ${isLive?'live':''}">${isLive?`<span>●</span><br>${m.time}`:m.time}</div><div class="teams"><div class="team">${crest(m.h,m.hc)}<span class="team-name">${esc(m.home)}</span></div><div class="team">${crest(m.a,m.ac)}<span class="team-name">${esc(m.away)}</span></div></div><div class="scorecol">${score?`<span>${m.score}</span><span class="${m.status==='upcoming'?'dimscore':''}">${m.awayScore}</span>`:`<span class="dimscore">–</span><span class="dimscore">–</span>`}</div><button class="star-btn ${state.favorites.has(m.id)?'selected':''}" aria-label="Toggle favorite" data-action="favorite" data-id="${m.id}"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></svg></button>${m.event?`<span class="match-badge">${esc(m.event)}</span>`:''}</div>`}
function matchesPage(){const filtered=fixtures.filter(m=>state.filter==='All'||state.filter==='Favorites'&&state.favorites.has(m.id)||state.filter==='Live'&&m.status==='live'||state.filter==='Finished'&&m.status==='finished'||state.filter==='Upcoming'&&m.status==='upcoming');const groups=[...new Set(filtered.map(m=>m.league))];return `${dateStrip()}<div class="date-heading"><div><div class="date-title">${dateLabel()}</div><div class="date-subtitle">Football · Demo fixture feed</div></div><div class="section-actions"><button class="tiny-action" data-action="calendar"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M7.5 3v4M16.5 3v4M4 9.5h16"/></svg>Calendar</button></div></div><div class="demo-notice"><span class="notice-dot"></span><span>Sample scores and fixtures for UI preview only — this screen is not connected to live match data.</span></div><div class="filters">${['All','Favorites','Live','Finished','Upcoming'].map(x=>`<button class="filter ${state.filter===x?'active':''} ${x==='Live'?'live':''}" data-action="filter" data-filter="${x}">${x==='Live'?'● ':''}${x}</button>`).join('')}</div>${groups.length?groups.map(g=>{const ms=filtered.filter(m=>m.league===g);const obj=ms[0];return `<section class="league"><div class="league-head"><span class="flag">${obj.flag}</span><div style="flex:1"><div class="league-name">${g}</div><div class="league-meta">${obj.country} · ${ms.length} matches</div></div><div class="league-right"><button data-action="league" data-league="${g}" aria-label="Open ${g} table">Table</button><button data-action="toggleleague" data-league="${g}" aria-label="Follow ${g}">${state.followed.has(g)?'★':'☆'}</button><span>⌄</span></div></div>${ms.map(matchRow).join('')}</section>`}).join(''):`<div class="empty"><strong>No matches in this filter</strong>Try another date or match status.</div>`}<div class="screen-footnote">Prototype based on the supplied FotMob APK · all match data is fictional demo content</div>`}
function newsPage(){return `<div class="page-heading"><div><h1>News</h1><p>Latest football stories</p></div><button class="tiny-action" data-action="search">⌕&nbsp; Search</button></div><div class="filters"><button class="filter active">For you</button><button class="filter">World</button><button class="filter">Transfers</button><button class="filter">Premier League</button></div><div class="content-card"><div class="news-hero"><span class="tag">Top story · Demo</span><h2>Weekend football: the matches and moments to follow</h2><p>Editorial preview · sample content</p></div>${newsItems.map(n=>`<article class="news-card"><div><span class="tag">${n.tag}</span><h3>${n.title}</h3><p>${n.time} · Demo article</p></div><div class="news-thumb ${n.cls}">${n.thumb}</div></article>`).join('')}</div><div class="screen-footnote">Headlines are placeholders and are not live news.</div>`}

ague-list">${comps.map(c=>`<div class="league-list-row" role="button" tabindex="0" data-action="selectleague" data-league="${c.name}"><div class="competition-mark">${c.icon}</div><div class="league-info"><strong>${c.name}</strong><small>${c.country} · ${c.teams} teams</small></div><button class="follow ${state.followed.has(c.name)?'following':''}" data-action="toggleleague" data-league="${c.name}">${state.followed.has(c.name)?'Following':'Follow +'}</button><span class="more-arrow">›</span></div>`).join('')}</div><div class="screen-footnote">Competition list and standings are illustrative demo content.</div>`}

function morePage(){return `<div class="page-heading"><div><h1>More</h1><p>Profile and app settings</p></div></div><div class="profile-card"><div class="avatar">LS</div><div><strong>Guest profile</strong><span>Sign in to sync favorites</span></div><button data-action="signin">Sign in</button></div><div class="settings-group"><div class="settings-title">Your FotMob</div>${[['☆','Favorites','Teams, leagues & players'],['♧','Notifications','Manage match and news alerts'],['◎','Lineup Builder','Create and save a team'],['↗','TV schedules','Find where to watch']].map(([i,n,d])=>`<button class="setting-row" style="width:100%;text-align:left;background:transparent" data-action="moreitem" data-name="${n}"><span class="setting-icon">${i}</span><span class="setting-name">${n}<small style="display:block;margin-top:3px">${d}</small></span><span class="more-arrow">›</span></button>`).join('')}</div><div class="settings-group"><div class="settings-title">Settings</div>${Object.entries(state.toggles).map(([n,on])=>`<div class="setting-row"><span class="setting-icon">${n==='Dark theme'?'◐':n==='Vibration on goals'?'〰':'♢'}</span><span class="setting-name">${n}</span><button class="toggle ${on?'on':''}" aria-label="Toggle ${n}" data-action="toggle" data-name="${n}"></button></div>`).join('')}</div><div class="settings-group"><div class="setting-row"><span class="setting-name">FotMob Plus</span><span class="more-arrow">›</span></div><div class="setting-row"><span class="setting-name">Help & support</span><span class="more-arrow">›</span></div><div class="setting-row"><span class="setting-name">About this prototype</span><small>UI demo</small></div></div><div class="screen-footnote">This prototype does not sign in, send notifications, or connect to FotMob services.</div>`}
function detailPage(){const m=fixtures.find(x=>x.id===state.matchId)||fixtures[0];const live=m.status==='live';return `<div class="detail-top"><div class="backrow"><button aria-label="Back" data-action="back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><span>${m.flag} &nbsp;${m.league}</span><button class="star-btn ${state.favorites.has(m.id)?'selected':''}" style="margin-left:auto" data-action="favorite" data-id="${m.id}" aria-label="Toggle favorite"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></svg></button></div><div class="detail-completion">${live?'LIVE · '+m.time:m.status==='finished'?'Full time':'Today · 18:30'} · Demo match</div></div><div class="match-scoreboard"><div class="score-teams"><div class="score-team">${crest(m.h,m.hc)}<strong>${esc(m.home)}</strong></div><div><div class="score-big">${m.status==='upcoming'?'–':m.score+'  –  '+m.awayScore}</div><div class="score-time ${m.status==='finished'?'finished':''}">${m.status==='live'?m.time:m.status==='finished'?'FT':'18:30'}</div></div><div class="score-team">${crest(m.a,m.ac)}<strong>${esc(m.away)}</strong></div></div></div><div class="detail-tabs">${['Overview','Stats','Lineups','Table'].map(t=>`<button class="detail-tab ${state.detailTab===t?'active':''}" data-action="detailtab" data-tab="${t}">${t}</button>`).join('')}</div>${state.detailTab==='Overview'?`<div class="event-list"><div class="event-title">Match events <span style="color:var(--muted);font-weight:500">· sample timeline</span></div>${live?`<div class="event"><time>12′</time><span class="event-icon">⚽</span><span>Mohamed Salah<small>Goal · Assist: Diogo Jota</small></span></div><div class="event"><time>24′</time><span class="event-icon">●</span><span>Match in progress<small>Live demo state</small></span></div>`:`<div class="event"><time>—</time><span class="event-icon">⚽</span><span>Match events will appear here<small>Placeholder for timeline</small></span></div>`}</div><div class="stats-card"><div class="event-title">Match facts</div>${[['Possession','58%','42%',58],['Shots','7','3',65],['Shots on target','3','1',75],['Corners','4','2',60]].map(s=>`<div class="stat-row"><div class="stat-label"><span>${s[1]}</span><span>${s[0]}</span><span>${s[2]}</span></div><div class="stat-track"><span style="width:${s[3]}%"></span><span style="width:${100-s[3]}%"></span></div></div>`).join('')}</div>`:state.detailTab==='Stats'?`<div class="stats-card"><div class="event-title">Team statistics · Demo</div>${[['Possession','58%','42%',58],['Expected goals','1.24','0.63',66],['Total shots','7','3',70],['Shots on target','3','1',75],['Corners','4','2',60],['Pass accuracy','87%','82%',52]].map(s=>`<div class="stat-row"><div class="stat-label"><span>${s[1]}</span><span>${s[0]}</span><span>${s[2]}</span></div><div class="stat-track"><span style="width:${s[3]}%"></span><span style="width:${100-s[3]}%"></span></div></div>`).join('')}</div>`:state.detailTab==='Lineups'?`<div class="lineup-field"><div class="player-column">${['GK','RB','CB','CB','LB'].map(x=>`<span class="player-dot">${x}</span>`).join('')}</div><div class="player-column">${['RW','CM','DM','CM','LW'].map(x=>`<span class="player-dot">${x}</span>`).join('')}</div><div class="player-column">${['ST'].map(x=>`<span class="player-dot">${x}</span>`).join('')}</div></div><div class="content-card" style="font-size:10px;color:var(--muted)">Line-up graphic is illustrative. Player names are not available in this demo.</div>`:`<div class="content-card"><div class="event-title">${m.league} table · Demo</div><table class="standings"><thead><tr><th># Club</th><th>P</th><th>Pts</th></tr></thead><tbody>${standings.slice(0,4).map((r,i)=>`<tr><td><span class="standing-club"><span class="position">${i+1}</span>${r[0]}</span></td><td>${r[2]}</td><td><strong>${r[6]}</strong></td></tr>`).join('')}</tbody></table></div>`}<div class="screen-footnote">All stats and events are fictional demo values.</div>`}
function searchOverlay(){const q=state.query.trim().toLowerCase();const items=[...fixtures.map(m=>({title:m.home+' vs '+m.away,sub:m.league+' · Match',icon:'⚽',id:m.id,kind:'match'})),...comps.map(c=>({title:c.name,sub:c.country+' · League',icon:c.icon,id:c.name,kind:'league'})),...['Cristiano Ronaldo','Lionel Messi','Kylian Mbappé'].map(x=>({title:x,sub:'Player',icon:'👤',id:x,kind:'player'}))].filter(x=>!q||(x.title+' '+x.sub).toLowerCase().includes(q)).slice(0,9);return `<div class="search-overlay"><div class="searchbar"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4.5 4.5"/></svg><input id="searchInput" value="${esc(state.query)}" placeholder="Search teams, leagues, players" autofocus><button data-action="closeSearch">Cancel</button></div><div class="search-hint">${q?'Search results':'Popular searches'}</div>${items.length?items.map(x=>`<div class="search-result" role="button" tabindex="0" data-action="searchresult" data-kind="${x.kind}" data-id="${esc(x.id)}"><span class="result-logo">${x.icon}</span><div><strong>${esc(x.title)}</strong><small>${x.sub}</small></div><button>☆</button></div>`).join(''):`<div class="empty"><strong>No results</strong>Try another team or competition.</div>`}</div>`}
function render(){document.getElementById('bottomnav').innerHTML=navItems.map(([name,path])=>`<button class="navitem ${state.page===name&&!state.matchId?'active':''}" data-action="nav" data-page="${name}"><svg viewBox="0 0 24 24">${path}</svg><span>${name}</span></button>`).join('');document.getElementById('content').innerHTML=state.matchId?detailPage():state.page==='Matches'?matchesPage():state.page==='News'?newsPage():state.page==='Leagues'?leaguesPage():state.page==='Transfers'?transfersPage():morePage();if(state.search){document.getElementById('app').insertAdjacentHTML('beforeend',searchOverlay());const input=document.getElementById('searchInput');if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length)}}}
let toastTimer;function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1900)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='nav'){state.page=b.dataset.page;state.matchId=null;state.leagueSelected=null;state.filter='All';state.search=false;render()}else if(a==='setdate'){state.dateOffset=Number(b.dataset.offset);render()}else if(a==='dateprev'){state.dateOffset--;render()}else if(a==='datenext'){state.dateOffset++;render()}else if(a==='filter'){state.filter=b.dataset.filter;render()}else if(a==='openmatch'){state.matchId=b.dataset.id;state.detailTab='Overview';state.search=false;render()}else if(a==='favorite'){e.stopPropagation();const id=b.dataset.id;state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);render();toast(state.favorites.has(id)?'Match added to favorites':'Match removed from favorites')}else if(a==='toggleleague'){e.stopPropagation();const l=b.dataset.league;state.followed.has(l)?state.followed.delete(l):state.followed.add(l);render();toast(state.followed.has(l)?'Following '+l:'Unfollowed '+l)}else if(a==='league'||a==='selectleague'){state.page='Leagues';state.leagueSelected=b.dataset.league;render()}else if(a==='backleague'){state.leagueSelected=null;render()}else if(a==='back'){state.matchId=null;render()}else if(a==='detailtab'){state.detailTab=b.dataset.tab;render()}else if(a==='search'){state.search=true;state.query='';render()}else if(a==='closeSearch'){state.search=false;render()}else if(a==='searchresult'){state.search=false;if(b.dataset.kind==='match'){state.matchId=b.dataset.id;state.page='Matches'}else if(b.dataset.kind==='league'){state.page='Leagues';state.leagueSelected=b.dataset.id}else{toast('Player pages are not implemented in this prototype')}render()}else if(a==='calendar'){toast('Calendar is a visual demo control')}else if(a==='notifications'){toast('Notifications are not connected in this prototype')}else if(a==='toggle'){const n=b.dataset.name;state.toggles[n]=!state.toggles[n];render();toast(n+' '+(state.toggles[n]?'on':'off'))}else if(a==='signin'){toast('Sign-in is not connected in this prototype')}else if(a==='moreitem'){toast(b.dataset.name+' preview is not connected')}else if(a==='transferfilter'){toast('Transfer filters are not implemented in this prototype')}});
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){const pos=e.target.selectionStart;state.query=e.target.value;const overlay=document.querySelector('.search-overlay');if(overlay){overlay.outerHTML=searchOverlay();const i=document.getElementById('searchInput');i.focus();i.setSelectionRange(pos,pos)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.search){state.search=false;render()}if(e.key==='Enter'&&e.target.matches('.match-row')){e.target.click()}});
render();
</script>
</body>
</html>
