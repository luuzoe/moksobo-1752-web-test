name: Refresh football feeds

on:
  # Publish the site for every code or content push to the default branch.
  push:
    branches:
      - main
  schedule:
    # GitHub scheduled workflows run on a five-minute minimum interval.
    # Offset from the top of the hour to reduce schedule congestion.
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: openligadb-score-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the published site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Cache approved ESPN responses for same-origin browser fallback
        run: python3 fotmob-demo/refresh_espn.py

      - name: Fetch changed score data and update the public snapshot
        continue-on-error: true
        run: python3 fotmob-demo/update_scores.py

      - name: Publish changed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fotmob-demo/data
          if git diff --cached --quiet; then
            echo "No published data changes."
            if [ "$GITHUB_EVENT_NAME" != "push" ]; then
              exit 0
            fi
          else
            git commit -m "Refresh football feed snapshots"
            git push origin HEAD:main
          fi
          # GITHUB_TOKEN pushes do not themselves trigger a legacy Pages build.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent || echo "Pages rebuild deferred; the next refresh can retry."
