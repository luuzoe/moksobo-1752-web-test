name: Refresh OpenLigaDB football feed

on:
  schedule:
    # GitHub scheduled workflows run on a five-minute minimum interval.
    # Offset from the top of the hour to reduce schedule congestion.
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openligadb-score-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the published site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch changed score data and update the public snapshot
        run: python3 fotmob-demo/update_scores.py

      - name: Publish changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fotmob-demo/data/matches.json
          if git diff --cached --quiet; then
            echo "No published data changes."
            exit 0
          fi
          git commit -m "Refresh OpenLigaDB football snapshot"
          git push origin HEAD:main
